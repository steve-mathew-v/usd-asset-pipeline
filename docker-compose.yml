# Brings up the pipeline server with one command: docker compose up
services:
  server:
    build: .
    ports:
      - "8000:8000"
    # reads MONGO_URI, DB_NAME, ROOT_USER, ROOT_PASS from the .env file
    env_file:
      - .env
    # files are stored in MongoDB (GridFS), so no host folders are needed
    restart: unless-stopped
