[project]
name = "obj-pipeline"
version = "1.0.0"
description = "Asset pipeline for sharing .obj files between DCC tools via a central server"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "motor==3.3.2",
    "pymongo==4.6.3",
    "pydantic",
    "python-dotenv",
    "aiofiles",
    "python-multipart",
    "requests",
    "PySide6",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
