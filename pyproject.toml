[project]
name = "obj-pipeline"
version = "1.0.0"
description = "Asset pipeline for sharing .obj files between DCC tools via a central server"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "motor==3.3.2",
    "pymongo==4.6.3",
    "pydantic",
    "python-dotenv",
    "python-multipart",
    "requests",
    "PySide6",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]
docs = [
    "pillow>=12.3.0",
    "python-pptx>=1.0.2",
]

[tool.ruff]
# 88 is the Black/ruff standard; PEP 8 permits raising the line limit.
line-length = 88

[tool.ruff.lint]
# E/W = pycodestyle (PEP 8), F = pyflakes (unused imports, undefined names)
select = ["E", "W", "F"]

[tool.ruff.lint.per-file-ignores]
# the deck generators hold long slide-text strings that can't be wrapped cleanly
"docs/*.py" = ["E501"]
