name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-server.txt
          pip install pytest httpx ruff

      - name: Lint (ruff / PEP 8)
        run: ruff check .

      - name: Run tests
        run: pytest -q
